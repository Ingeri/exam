name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type check, schema validation, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders only; CI does not connect to this database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/exam_ci?schema=public
      AUTH_JWT_SECRET: ci-only-secret-value-that-is-not-used-outside-this-workflow

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Validate Prisma schema
        run: pnpm exec prisma validate

      - name: Build
        run: pnpm build
